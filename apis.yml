name: KeepFace
description: KeepFace is an all-in-one influencer marketing platform that helps brands,
  agencies, and enterprises discover, manage, and measure creator campaigns at scale.
  The platform spans creator discovery and CRM across 2M+ influencers in 43 countries,
  campaign management from brief through outreach, contract, and content approval,
  AI-driven brand-safety scoring and sentiment analysis of posts, real-time performance
  reporting (engagement rate, estimated media value, deletion-proof post archives),
  affiliate link tracking with pay-on-attributed-sales commissioning, and customer
  and employee advocacy programs. KeepFace is a portfolio company of 500 Global.
