apis:
- aid: keepface:affiliate
  name: Keepface Affiliate API v2
  description: The public server-side affiliate tracking API for Keepface. Brands POST
    sale and refund events from their own backend (or from Shopify, or from the browser
    JS pixel) and Keepface attributes them to the creator whose link or discount code
    drove the sale. Every write is HMAC-SHA256 signed with a per-brand secret over a
    timestamped payload, replay-protected at a 300 second tolerance, and idempotent on
    (brand_id, order_id). A public click-resolve endpoint turns a short affiliate token
    into a destination URL, cookie window and campaign status. Rate limits and Retry-After
    are published per endpoint, and the API returns X-RateLimit-Limit / X-RateLimit-Remaining
    on live responses.
  humanURL: https://help.keepface.com/brand/affiliate-program/api-reference/
  baseURL: https://api.keepface.ai/api/v2
  tags:
  - Affiliate Marketing
  - Attribution
  - Webhooks
  - Conversion Tracking
  properties:
  - type: APIReference
    url: https://help.keepface.com/brand/affiliate-program/api-reference/
  - type: Documentation
    url: https://help.keepface.com/brand/affiliate-program/postback-hmac-integration/
  - type: Webhooks
    url: asyncapi/keepface-affiliate-webhooks.yml
  - type: ErrorCatalog
    url: errors/keepface-problem-types.yml
  - type: RateLimits
    url: rate-limits/keepface-rate-limits.yml
  - type: DataModel
    url: data-model/keepface-data-model.yml
- aid: keepface:mcp
  name: Keepface MCP Server
  description: A hosted, remote Model Context Protocol server that exposes 94 actions
    across the Keepface brand workspace — discovery, lists, campaigns, outreach, reporting,
    affiliate, wallet (read-only), CRM, brands, AI analysis and creator chat. An agent
    POSTs to the endpoint with a workspace-scoped bearer token created in Settings, API
    Tokens; the server loads only the tools the token's scopes allow. Reads execute
    immediately, every write returns a preview and runs only on confirmation, and no
    token can move money — top-up, withdraw, currency conversion, influencer payout and
    affiliate commission changes are never exposed.
  humanURL: https://help.keepface.com/brand/integrations/manage-with-claude-code/
  baseURL: https://mcp.keepface.com/mcp
  tags:
  - MCP
  - AI Agents
  - Influencer Marketing
  properties:
  - type: MCPServer
    url: mcp/keepface-mcp.yml
  - type: Documentation
    url: https://help.keepface.com/brand/integrations/claude-code-tools-reference/
