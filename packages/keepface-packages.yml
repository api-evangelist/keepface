    note: >-
      Keepface ships a first-party JS pixel that brands install on their checkout
      success page, but the documentation describes only the conceptual flow —
      the actual script tag, CDN URL and any version pin are not published on the
      public help centre, and the snippet appears to be issued per brand inside
      the panel. Nothing can be pinned or versioned from the public surface, so
      version is null: checked, nothing to record.

integration_surface:
  note: >-
    The absence of an SDK is less consequential here than it would normally be,
    because Keepface's two integration paths need no client library. The
    Affiliate API v2 is four HTTPS endpoints with an HMAC signature any standard
    crypto library can produce, and the agent surface is an MCP server consumed
    by an off-the-shelf MCP client via a JSON config block. There is no
    first-party wrapper for either.

