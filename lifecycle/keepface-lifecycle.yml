credential_lifecycle:
  # Real, dated lifecycle rules on the two credentials Keepface issues.
  brand_affiliate_secret:
    shown_once: true
    rotatable: true
    overlap_after_rotation_days: 7
    note: the previous secret stays valid for 7 days after rotation so a caller can
      roll without downtime
  mcp_api_token:
    shown_once: true
    default_expiry_days: 90
    expiry_configurable: true
    revocable: true
    revocation_effect: the connection stops working immediately; normal login is unaffected
    last_used_visible: true

