# Keepface ships a first-party, hosted, remote MCP server. It is documented on the
# provider's own help centre and the endpoint answers live: an anonymous
# POST tools/list returns HTTP 401 {"error":"missing bearer token"} (Express,
# behind Cloudflare), which confirms the server exists and is auth-gated rather
# than absent. The tool list below is therefore transcribed from the provider's
# published tools reference (94 actions, named verbatim) — NOT from a live
# tools/list response. Input schemas require an authenticated introspection and
# are deliberately not recorded here.

deployment:
  mode: remote
  endpoint: https://mcp.keepface.com/mcp
  install: null
  package: null
  auth: api-key
  verified: probed

server:
  name: keepface
  transport: http
  url: https://mcp.keepface.com/mcp
  protocol: MCP over HTTP
  docs:
    setup: https://help.keepface.com/brand/integrations/manage-with-claude-code/
    tools_reference: https://help.keepface.com/brand/integrations/claude-code-tools-reference/

authentication:
  scheme: bearer
  header: Authorization
  format: 'Bearer kf_<token>'
  token_prefix: kf_
  issued_at: Settings, API Tokens (inside a brand workspace)
  shown_once: true
  default_expiry_days: 90
  expiry_configurable: true
  revocable: true
  workspace_pinned: true
  note: >-
    A token is pinned to the single brand workspace it was created in and cannot
    act in any other workspace, even one the same user owns. The server resolves
    workspace and scopes from the token itself; no workspace header is required.

client_configuration:
  # Published verbatim by the provider on the setup page.
  format: json
  snippet: |
    {
      "mcpServers": {
        "keepface": {
          "type": "http",
          "url": "https://mcp.keepface.com/mcp",
          "headers": { "Authorization": "Bearer kf_your_token_here" }
        }
      }
    }

safety_model:
  # These are provider-published guarantees, quoted from the tools reference.
  reads_immediate: true
  writes_require_confirmation: true
  destructive_marked: true
  money_movement_blocked: true
  notes:
  - 'No money moves, ever. Top-up, convert, withdraw, influencer payouts and affiliate
    commission settings are never available. Wallet and escrow are read-only.'
  - 'Writes confirm first. Nothing is created, changed, sent or deleted until you
    confirm the preview.'
  - 'One workspace. A token only acts in the workspace you created it in.'
  markers:
    $: charges the wallet
    "✉": sends a real message or email
    '!': destructive (deletes data)

tool_count_published: 94
tools_recorded: 94
